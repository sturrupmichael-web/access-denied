<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Denied</title>
  <meta name="description" content="A Papers, Please-style game on the IT service desk. Verify every caller, approve or deny their request, and don't let the social engineers in.">
  <meta property="og:title" content="Access Denied">
  <meta property="og:description" content="Verify the caller. Approve or deny. Don't get socially engineered.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#008080">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23008080'/%3E%3Crect x='3' y='7' width='10' height='7' fill='%23c0c0c0'/%3E%3Cpath d='M5 7V5a3 3 0 0 1 6 0v2' fill='none' stroke='%23c0c0c0' stroke-width='2'/%3E%3Ccircle cx='8' cy='10.5' r='1.3' fill='%23a00000'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/desktop.css">
</head>
<body>
  <div class="desktop">
    <main id="workspace" class="workspace"></main>
    <footer class="taskbar">
      <div class="taskbar-brand"><span class="brand-mark" aria-hidden="true">▣</span> HD ServiceDesk 95</div>
      <div class="taskbar-spacer"></div>
      <div id="queue" class="queue inset" aria-live="polite"></div>
      <div class="tray inset">
        <button id="mute-btn" class="tray-btn" type="button">🔊</button>
        <span id="clock" class="clock">09:00</span>
      </div>
    </footer>
  </div>
  <div id="modal-root"></div>
  <div id="boot" class="boot">Loading...</div>
  <script>
    // Shows load errors on the page instead of a blank desktop (main.js removes #boot once running).
    addEventListener('error', (e) => {
      const b = document.getElementById('boot');
      if (b) b.textContent = 'The game failed to load: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'unknown error');
    }, true);
    addEventListener('unhandledrejection', (e) => {
      const b = document.getElementById('boot');
      if (b) b.textContent = 'The game failed to load: ' + (e.reason && e.reason.message || e.reason);
    });
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
